AWSTemplateFormatVersion: "2010-09-09"
Description: devbox-kioshi-devops - EC2 t4g.medium Ubuntu ARM com Claude Code Remote Control (acesso apenas via SSM)

Parameters:
  InstanceType:
    Type: String
    Default: t4g.medium
  UbuntuAmi:
    Type: AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>
    Default: /aws/service/canonical/ubuntu/server/26.04/stable/current/arm64/hvm/ebs-gp3/ami-id
  VolumeSizeGiB:
    Type: Number
    Default: 50
  InstanceRolePolicyArn:
    Type: String
    Default: arn:aws:iam::aws:policy/AdministratorAccess
    AllowedValues:
      - arn:aws:iam::aws:policy/AdministratorAccess
      - arn:aws:iam::aws:policy/PowerUserAccess
      - arn:aws:iam::aws:policy/ReadOnlyAccess
    Description: Permissao AWS que o Claude tera de dentro da instancia

Resources:
  Vpc:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: 10.42.0.0/16
      EnableDnsHostnames: true
      EnableDnsSupport: true
      Tags: [{ Key: Name, Value: devbox-kioshi-devops }]

  InternetGateway:
    Type: AWS::EC2::InternetGateway
    Properties:
      Tags: [{ Key: Name, Value: devbox-kioshi-devops }]

  GatewayAttachment:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      VpcId: !Ref Vpc
      InternetGatewayId: !Ref InternetGateway

  PublicSubnet:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: 10.42.0.0/24
      AvailabilityZone: !Select [0, !GetAZs ""]
      MapPublicIpOnLaunch: true
      Tags: [{ Key: Name, Value: devbox-kioshi-devops-public }]

  RouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref Vpc
      Tags: [{ Key: Name, Value: devbox-kioshi-devops }]

  DefaultRoute:
    Type: AWS::EC2::Route
    DependsOn: GatewayAttachment
    Properties:
      RouteTableId: !Ref RouteTable
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref InternetGateway

  SubnetRouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PublicSubnet
      RouteTableId: !Ref RouteTable

  # Sem nenhuma regra de entrada: acesso shell apenas via SSM Session Manager.
  SecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: devbox-kioshi-devops - sem ingress, egress liberado
      VpcId: !Ref Vpc
      SecurityGroupEgress:
        - IpProtocol: "-1"
          CidrIp: 0.0.0.0/0
      Tags: [{ Key: Name, Value: devbox-kioshi-devops }]

  # Guarda bootstrap.sh e o payload de dotfiles enviados pelo script local.
  ArtifactsBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub devbox-kioshi-devops-${AWS::AccountId}-${AWS::Region}
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault: { SSEAlgorithm: AES256 }

  InstanceRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub devbox-kioshi-devops-instance-${AWS::Region}
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: ec2.amazonaws.com }
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AmazonSSMManagedInstanceCore
        - !Ref InstanceRolePolicyArn
      Policies:
        - PolicyName: devbox-kioshi-devops-artifacts
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: [s3:GetObject, s3:ListBucket]
                Resource:
                  - !GetAtt ArtifactsBucket.Arn
                  - !Sub ${ArtifactsBucket.Arn}/*

  InstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      Roles: [!Ref InstanceRole]

  Instance:
    Type: AWS::EC2::Instance
    DependsOn: DefaultRoute
    Properties:
      InstanceType: !Ref InstanceType
      ImageId: !Ref UbuntuAmi
      IamInstanceProfile: !Ref InstanceProfile
      SubnetId: !Ref PublicSubnet
      SecurityGroupIds: [!Ref SecurityGroup]
      CreditSpecification: { CPUCredits: unlimited }
      MetadataOptions:
        HttpTokens: required
        HttpPutResponseHopLimit: 2
      BlockDeviceMappings:
        - DeviceName: /dev/sda1
          Ebs:
            VolumeType: gp3
            VolumeSize: !Ref VolumeSizeGiB
            Encrypted: true
            DeleteOnTermination: true
      Tags: [{ Key: Name, Value: devbox-kioshi-devops }]
      UserData:
        Fn::Base64: !Sub |
          #!/bin/bash
          # Espera o script local enviar bootstrap.sh + payload para o S3 e executa o bootstrap uma unica vez.
          set -eux
          exec > >(tee -a /var/log/devbox-kioshi-devops-userdata.log) 2>&1
          [ -f /var/lib/devbox-kioshi-devops/bootstrapped ] && exit 0
          apt-get update && apt-get install -y unzip curl
          if ! command -v aws >/dev/null; then
            curl -fsSL https://awscli.amazonaws.com/awscli-exe-linux-aarch64.zip -o /tmp/awscli.zip
            unzip -q /tmp/awscli.zip -d /tmp && /tmp/aws/install --update
          fi
          for i in $(seq 1 120); do
            aws s3 cp s3://${ArtifactsBucket}/bootstrap.sh /root/bootstrap.sh --region ${AWS::Region} && break
            sleep 10
          done
          DEVBOX_BUCKET=${ArtifactsBucket} DEVBOX_REGION=${AWS::Region} bash /root/bootstrap.sh

Outputs:
  InstanceId:
    Value: !Ref Instance
  BucketName:
    Value: !Ref ArtifactsBucket
  InstanceRoleArn:
    Value: !GetAtt InstanceRole.Arn
